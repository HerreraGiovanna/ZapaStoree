<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zapas Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css"
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Zapas Store</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>

            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Nosotros</a></li>
                </ul>

            </div>
        </div>

    </nav>
<section class="hero text-center d-flex align-items-center justify-content-center">
  <div class="container">
    <h1 class="display-4 fw-bold">¡Bienvenido a Zapas Store!</h1>
    <p class="lead">Las mejores zapatillas al mejor precio</p>
    <a href="#" class="btn btn-dark btn-lg mt-3">Ver catálogo</a>
  </div>
</section>

<section id="products" class="container my-5">
  <h2 class="text-center mb-4">Productos Destacados</h2>
  <div class="row">
    <div class="col-md-4">
      <div class="card">
        <img src="images/zapatilla1.jpg" class="card-img-top" alt="Zapatilla 1">
        <div class="card-body">
          <h5 class="card-title">Zapatilla Modelo A</h5>
          <p class="card-text">$120.000</p>
          <a href="#" class="btn btn-primary">Comprar</a>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card">
        <img src="images/zapatilla2.jpg" class="card-img-top" alt="Zapatilla 2">
        <div class="card-body">
          <h5 class="card-title">Zapatilla Modelo B</h5>
          <p class="card-text">$100.000</p>
          <a href="#" class="btn btn-primary">Comprar</a>
        </div>
      </div>
    </div>
   <div class="col-md-4">
      <div class="card">
        <img src="images/zapatilla3.jpg" class="card-img-top" alt="Zapatilla 3">
        <div class="card-body">
          <h5 class="card-title">Zapatilla Modelo C</h5>
          <p class="card-text">$180.000</p>
          <a href="#" class="btn btn-primary">Comprar</a>
        </div>
      </div>
    </div>
    
  </div>
</section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
