<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Zapas Store</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Tu CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Zapas Store</a>
    </div>
  </nav>

  <!-- Sección del catálogo -->
  <section class="container my-5">
    <h2 class="text-center mb-4">Catálogo de Zapatillas</h2>
    <div class="row">
      <!-- Producto 1 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="img/zapa1.jpg" class="card-img-top" alt="Zapatilla 1">
          <div class="card-body">
            <h5 class="card-title">Zapatilla Nike Air</h5>
            <p class="card-text">$45.000</p>
            <button class="btn btn-primary">Agregar al carrito</button>
          </div>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="img/zapa2.jpg" class="card-img-top" alt="Zapatilla 2">
          <div class="card-body">
            <h5 class="card-title">Adidas Superstar</h5>
            <p class="card-text">$40.000</p>
            <button class="btn btn-primary">Agregar al carrito</button>
          </div>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="col-md-4 mb-4">
        <div class="card">
          <img src="img/zapa3.jpg" class="card-img-top" alt="Zapatilla 3">
          <div class="card-body">
            <h5 class="card-title">Puma Classic</h5>
            <p class="card-text">$38.000</p>
            <button class="btn btn-primary">Agregar al carrito</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center text-white bg-dark py-3">
    <p class="mb-0">&copy; 2025 Zapas Store - Todos los derechos reservados</p>
  </footer>
</body>
</html>
